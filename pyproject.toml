[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acr-runtime"
version = "0.1.0"
description = "Local-first Adaptive Cognitive Runtime prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ACR contributors"}]
dependencies = []

[project.optional-dependencies]
secrets = ["keyring>=25.7,<26"]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
acr = "acr_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["acr_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
