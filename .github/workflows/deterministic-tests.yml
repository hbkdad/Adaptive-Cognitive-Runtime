name: deterministic-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-tier:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier:
          - unit
          - integration
          - scenario
          - benchmark
          - security
          - regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install local package
        run: python -m pip install -e .
      - name: Validate deterministic test manifest
        run: python -m acr_runtime.test_architecture validate
      - name: Run deterministic tier
        run: python -m acr_runtime.test_architecture run ${{ matrix.tier }} --quiet
